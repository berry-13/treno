<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>treno — predictive transit intelligence</title>
<style>
  :root { --bg:#0e1116; --panel:#161b23; --line:#232a35; --fg:#e6e9ef; --dim:#8b93a3; --accent:#4da3ff; --good:#3ecf8e; --warn:#f5c451; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:880px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:18px; font-weight:650; margin:0 0 4px; letter-spacing:.3px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
  input[type=search] { width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--fg); font-size:15px; outline:none; }
  input[type=search]:focus { border-color:var(--accent); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:14px; }
  .row { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .muted { color:var(--dim); }
  .tiny { font-size:12px; }
  .num { font-weight:700; font-size:17px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .b-run { color:var(--good); border-color:var(--good); }
  .b-sched { color:var(--accent); border-color:var(--accent); }
  .b-arr { color:var(--dim); }
  .b-canc { color:var(--bad); border-color:var(--bad); }
  .conf-HIGH { color:var(--good); } .conf-MEDIUM { color:var(--warn); } .conf-LOW { color:var(--bad); }
  .delay-pos { color:var(--warn); font-weight:600; } .delay-neg { color:var(--good); font-weight:600; }
  table { width:100%; border-collapse:collapse; margin-top:10px; font-variant-numeric:tabular-nums; }
  th { text-align:left; color:var(--dim); font-weight:500; font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:7px 8px; border-bottom:1px solid var(--line); }
  tr.passed td { color:var(--dim); }
  tr.next td { background:#1a2130; }
  .pill-actual { color:var(--good); } .pill-op { color:var(--warn); } .pill-sched { color:var(--dim); }
  .obs { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .obs .chip { background:#101623; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12.5px; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .clickable { cursor:pointer; }
  .three { display:flex; gap:18px; margin-top:8px; flex-wrap:wrap; }
  .three div span { display:block; }
  .lbl { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; }
  .val { font-size:16px; font-weight:650; }
  .covbars { display:flex; align-items:flex-end; gap:1px; height:52px; margin-top:10px; }
  .covbars i { flex:1; min-width:2px; background:var(--accent); border-radius:1px 1px 0 0; }
  .covbars i.night { background:#2a3345; }
  .covbars i.gap { background:var(--bad); }
  .trend-down { color:var(--good); font-weight:600; } .trend-up { color:var(--bad); font-weight:600; } .trend-flat { color:var(--dim); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim); font-weight:600; margin:26px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>treno</h1>
  <div class="sub">independent predictive realtime intelligence · Lombardy rail (POC) — scheduled vs operator vs ours</div>
  <input id="q" type="search" placeholder="train number (e.g. 2174) — live runs below" autocomplete="off">
  <div id="list"></div>
  <div id="detail"></div>
  <div id="ops"></div>
</div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const fmtHm = (ms) => ms == null ? '—' : new Date(ms).toLocaleTimeString('it-IT', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit' });
const fmtAge = (sec) => sec == null ? '—' : (sec < 60 ? sec + 's ago' : Math.round(sec / 60) + 'm ago');
const delayStr = (sec) => {
  if (sec == null) return '—';
  const sign = sec > 0 ? '+' : sec < 0 ? '−' : '';
  const a = Math.abs(Math.round(sec / 60));
  return sec === 0 ? 'on time' : sign + a + 'm';
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function badge(st) {
  const map = { running:['b-run','RUNNING'], scheduled:['b-sched','SCHEDULED'], arrived:['b-arr','ARRIVED'], cancelled:['b-canc','CANCELLED'], unknown:['','UNKNOWN'] };
  const [cls, label] = map[st] || map.unknown;
  return '<span class="badge ' + cls + '">' + label + '</span>';
}

async function loadList() {
  const url = new URL('/api/trains', location.origin);
  url.searchParams.set('limit', '25');
  const res = await fetch(url); const rows = await res.json();
  $('#list').innerHTML = rows.length ? rows.map((r) => renderRunCard(r)).join('') : '<div class="card muted">no live runs yet — collector warming up</div>';
  bindCards();
}

function renderRunCard(r) {
  const s = r.state || {};
  const delayCls = (s.operatorDelaySec ?? 0) > 60 ? 'delay-pos' : 'delay-neg';
  return '<div class="card clickable" data-id="' + r.id + '">' +
    '<div class="row"><span class="num">' + esc(r.trainNumber) + '</span>' +
    '<span class="muted">' + esc(s.origin?.name || r.origin || '?') + ' → ' + esc(s.destination?.name || r.destination || '?') + '</span>' +
    badge(s.status) +
    (s.operatorDelaySec != null ? '<span class="' + delayCls + '">' + delayStr(s.operatorDelaySec) + '</span>' : '') +
    (s.confidence ? '<span class="tiny conf-' + s.confidence + '">' + s.confidence + '</span>' : '') +
    '<span class="tiny muted" style="margin-left:auto">' + (r.updatedAt ? fmtAge(Math.round((Date.now() - r.updatedAt) / 1000)) : '') + '</span></div>' +
    (s.latestLocation?.name ? '<div class="tiny muted">last: ' + esc(s.latestLocation.name) + (s.latestObservedAt ? ' · ' + fmtAge(Math.round((Date.now() - s.latestObservedAt) / 1000)) : '') + ' [' + esc(s.latestSource) + ']</div>' : '') +
    '</div>';
}

function bindCards() {
  document.querySelectorAll('.card.clickable').forEach((el) => {
    el.addEventListener('click', () => loadDetail(el.dataset.id));
  });
}

// §60 live detail: SSE stream, native auto-reconnect; a state change just
// re-renders the panel from the fresh fetch
let detailES = null;
function watchDetail(id) {
  if (detailES) detailES.close();
  try {
    detailES = new EventSource('/api/stream/trains/' + encodeURIComponent(id));
    detailES.addEventListener('state_update', () => { if (detailId === id) loadDetail(id); });
  } catch { /* old browsers fall back to the 10s list refresh */ }
}

let detailId = null;
async function loadDetail(id) {
  detailId = id;
  watchDetail(id);
  const res = await fetch('/api/trains/' + encodeURIComponent(id));
  if (!res.ok) { $('#detail').innerHTML = '<div class="card">not found</div>'; return; }
  const r = await res.json();
  const s = r.state || {};
  const stops = r.stops || [];
  const now = Date.now();
  let nextIdx = stops.findIndex((x) => x.actual_arr_epoch == null && x.cancelled !== 1);
  const rows = stops.map((x, i) => {
    const passedRow = x.actual_arr_epoch != null;
    const cls = passedRow ? 'passed' : (i === nextIdx ? 'next' : '');
    return '<tr class="' + cls + '"><td>' + esc(x.stopName || x.stop_id) + '</td>' +
      '<td class="pill-sched">' + fmtHm(x.sched_arr_epoch) + '</td>' +
      '<td class="pill-op">' + fmtHm(x.op_pred_arr_epoch) + '</td>' +
      '<td class="pill-actual">' + fmtHm(x.actual_arr_epoch) + '</td>' +
      '<td>' + (x.arr_delay_sec != null ? delayStr(x.arr_delay_sec) : '—') + '</td>' +
      '<td>' + esc(x.platform_actual || '—') + '</td></tr>';
  }).join('');
  const dest = stops[stops.length - 1] || {};
  $('#detail').innerHTML =
    '<div class="card">' +
    '<div class="row"><span class="num" style="font-size:22px">' + esc(r.trainNumber) + '</span>' +
    '<span>' + esc(s.origin?.name || '?') + ' → ' + esc(s.destination?.name || '?') + '</span>' +
    badge(s.status) + '<span class="tiny muted">' + esc(r.serviceDate) + ' · run ' + r.id + '</span></div>' +
    '<div class="three">' +
    '<div><span class="lbl">scheduled arrival</span><span class="val pill-sched">' + fmtHm(s.schedArrEpoch) + '</span></div>' +
    '<div><span class="lbl">operator estimate</span><span class="val pill-op">' + fmtHm(s.destinationOperatorEta) + '</span></div>' +
    '<div><span class="lbl">our estimate (v0)</span><span class="val">' + fmtHm(s.destinationOperatorEta) + '</span></div>' +
    '<div><span class="lbl">confidence</span><span class="val conf-' + esc(s.confidence || '') + '">' + esc(s.confidence || '—') + '</span></div>' +
    '</div>' +
    '<div class="obs">' +
    (s.latestLocation?.name ? '<span class="chip">last observed: <b>' + esc(s.latestLocation.name) + '</b>' + (s.latestObservedAt ? ' · ' + fmtAge(Math.round((now - s.latestObservedAt) / 1000)) : '') + ' · ' + esc(s.latestSource || '') + (s.latestLocation?.kind === 'reporting_point' ? ' · reporting point' : '') + '</span>' : '') +
    (s.operatorDelaySec != null ? '<span class="chip">operator delay: ' + delayStr(s.operatorDelaySec) + '</span>' : '') +
    (s.sourceDelaySpreadSec != null ? '<span class="chip">source spread: ' + Math.round(s.sourceDelaySpreadSec / 60) + 'm</span>' : '') +
    Object.entries(s.sources || {}).map(([src, o]) => '<span class="chip">' + src + ': ' + (o.delaySec != null ? delayStr(o.delaySec) : 'n/d') + ' · age ' + fmtAge(o.ageSec) + '</span>').join('') +
    '</div>' +
    '<table><thead><tr><th>stop</th><th>scheduled</th><th>operator</th><th>actual</th><th>delay</th><th>plat</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="tiny muted" style="margin-top:10px">v0 passthrough model: our estimate = operator ETA until the benchmark shows we can beat it. Sources: MIA + ViaggiaTreno, fused with per-source provenance.</div>' +
    '</div>';
  $('#list').innerHTML = '';
}

$('#q').addEventListener('keydown', async (ev) => {
  if (ev.key !== 'Enter') return;
  const v = ev.target.value.trim();
  if (v === '') return;
  const res = await fetch('/api/trains?q=' + encodeURIComponent(v) + '&limit=1');
  const rows = await res.json();
  if (rows.length) loadDetail(String(rows[0].id));
  else $('#detail').innerHTML = '<div class="card muted">no run found for ' + esc(v) + '</div>';
});

// collection heartbeat + nightly backtest trend (ops view)
async function loadOps() {
  try {
    const [covRes, btRes, corRes] = await Promise.all([fetch('/api/coverage'), fetch('/api/backtest?limit=7'), fetch('/api/corridors?limit=10').catch(() => null)]);
    const cov = await covRes.json();
    const bt = await btRes.json();
    const start = Math.ceil(cov.from / cov.windowMs) * cov.windowMs;
    const byBucket = new Map(cov.buckets.map((b) => [b.bucket, b]));
    const maxObs = Math.max(...cov.buckets.map((b) => b.observations), 1);
    const bars = [];
    for (let t = start; t <= Date.now(); t += cov.windowMs) {
      const b = byBucket.get(t) || { observations: 0, stateUpdates: 0, snapshots: {} };
      const hour = new Date(t).toLocaleString('it-IT', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
      const srcs = Object.entries(b.snapshots).map(([s, n]) => s + ':' + n).join(' ') || 'no polls';
      const service = Number(new Date(t).toLocaleString('en-GB', { timeZone: 'Europe/Rome', hour: '2-digit', hour12: false }));
      const cls = b.observations > 0 ? '' : (service >= 6 && service < 23 ? 'gap' : 'night');
      bars.push('<i class="' + cls + '" style="height:' + Math.max(6, Math.round(100 * b.observations / maxObs)) + '%" title="' + hour + ' · ' + b.observations + ' obs · ' + b.stateUpdates + ' state updates · ' + srcs + '"></i>');
    }
    const total48 = cov.buckets.reduce((a, b) => a + b.observations, 0);
    const covHtml =
      '<h2>collection heartbeat — 48h</h2><div class="card">' +
      '<div class="row"><span class="num">' + total48.toLocaleString('it-IT') + '</span><span class="muted">observations · red = expected trains but none observed</span></div>' +
      '<div class="covbars">' + bars.join('') + '</div></div>';
    const mdTable = (md) => {
      const rows = md.split('\n').filter((l) => l.trim().startsWith('|') && !/\|[\s:-]+\|/.test(l));
      const cells = rows.map((l) => l.split('|').slice(1, -1).map((s) => s.trim()));
      if (!cells.length) return '<div class="tiny muted">' + esc(md.split('\n')[0] || '') + '</div>';
      return '<table><thead><tr>' + cells[0].map((x) => '<th>' + esc(x) + '</th>').join('') + '</tr></thead><tbody>' +
        cells.slice(1).map((r) => '<tr>' + r.map((x) => '<td>' + esc(x) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
    };
    const btHtml = !bt.reports.length ? '' :
      '<h2>prediction accuracy — nightly backtest (MAE, lower is better)</h2><div class="card">' +
      bt.reports.map((r) => '<div class="row" style="margin-top:8px"><span class="badge">' + r.date + '</span></div>' + mdTable(r.markdown)).join('') +
      '<div class="tiny muted" style="margin-top:8px">heuristic = schedule-only · operator = Trenord ETA · residual-v1 = ours. Reports regenerate nightly at 03:30.</div></div>';
    let corHtml = '';
    try {
      const cor = await (corRes ? corRes.json() : { corridors: [] });
      if (cor.corridors && cor.corridors.length) {
        corHtml = '<h2>corridor health — last hour</h2><div class="card"><table><thead><tr><th>segment</th><th>traversals</th><th>median delay delta</th><th>worst</th></tr></thead><tbody>' +
          cor.corridors.map((r) => '<tr><td>' + esc(r.fromName + ' → ' + r.toName) + '</td><td>' + r.traversals + '</td><td>' + delayStr(r.medianDelayDeltaSec) + '</td><td>' + delayStr(r.worstDelayDeltaSec) + '</td></tr>').join('') +
          '</tbody></table></div>';
      }
    } catch { /* corridors endpoint absent on old images */ }
    $('#ops').innerHTML = covHtml + btHtml + corHtml;
  } catch { $('#ops').innerHTML = '<div class="card muted tiny">ops panels unavailable (old server image — redeploy to enable)</div>'; }
}

loadList();
loadOps();
setInterval(loadList, 10000);
setInterval(loadOps, 300000);
</script>
</body>
</html>
