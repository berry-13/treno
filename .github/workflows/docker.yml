# Docker image build & push (PLAN_docker_clickhouse.md §4): multi-arch
# (amd64+arm64) to GHCR on every main push and version tag, plus a compose
# smoke job that boots collector+api+clickhouse from the pushed image and
# verifies health + live board data before calling the build good.
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose up (pushed image)
        env:
          TRENO_IMAGE: ghcr.io/${{ github.repository }}:latest
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build collector api clickhouse

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/health > /tmp/health.json 2>/dev/null; then
              echo "health green after ~$((i*10))s:"; cat /tmp/health.json; exit 0
            fi
            sleep 10
          done
          echo "API never became healthy"; docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 100; exit 1

      - name: Board data flowing (Milano Centrale departures)
        run: |
          GTFS_LOAD_MINUTES=15
          for i in $(seq 1 $((GTFS_LOAD_MINUTES * 6))); do
            n=$(curl -fsS http://127.0.0.1:8787/api/stops/S01700/departures | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("departures", [])))' 2>/dev/null || echo 0)
            if [ "$n" -gt 0 ]; then echo "departures: $n"; exit 0; fi
            sleep 10
          done
          echo "no departures after ${GTFS_LOAD_MINUTES}m — collector logs follow"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 100 collector
          exit 1

      - name: ClickHouse mirror receiving rows
        run: |
          for i in $(seq 1 30); do
            n=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T clickhouse clickhouse-client --query 'SELECT count() FROM train_runs' 2>/dev/null || echo 0)
            if [ "$n" -gt 0 ]; then echo "train_runs mirrored: $n"; exit 0; fi
            sleep 10
          done
          echo "ClickHouse mirror stayed empty"; docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 50 collector; exit 1

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
